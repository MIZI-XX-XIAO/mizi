# 本文件在GitHub仓库中使用Windows和Python 3.12验证无真实数据的源码部署。
name: Windows Python 3.12

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true

      - name: Verify lock and exported pip requirements
        shell: pwsh
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --output-file requirements.txt
          uv export --frozen --no-group build --no-emit-project --output-file requirements-dev.txt
          uv export --frozen --only-group build --no-emit-project --output-file requirements-build.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt requirements-build.txt

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run source tests without production data
        run: uv run --frozen python -X utf8 -m pytest -p no:cacheprovider -q
