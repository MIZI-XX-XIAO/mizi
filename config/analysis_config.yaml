# 本文件集中配置缺陷轮廓提取、空间聚类、周期发现和预警算法的全部关键参数。
detection_profiles:
  5S: &default_detection
    red_min: 150
    red_dominance: 40
    morph_kernel_size: 3
    min_component_area: 1
    max_component_area: 5000
    micro_max_component_area: 7
    region_min_width_ratio: 0.4
    region_min_height_ratio: 0.4
  5X: *default_detection
  7S: *default_detection
  7X: *default_detection

spatial_cluster_radius_norm: 0.03
minimum_repeat_occurrences: 4
minimum_period: 2
maximum_period: 200
period_order_tolerance: 0
minimum_period_precision: 0.75
minimum_period_coverage: 0.65
burst_minimum_length: 4
missing_order_tolerance: 0
warning_lead_products: 3

# 产品对齐和水平轨迹发现。
registration_min_score: 0.80
horizontal_y_tolerance_norm: 0.02
horizontal_min_x_span_norm: 0.05
trajectory_min_occurrences: 4
linear_drift_min_abs_spearman: 0.80

evaluation_center_tolerance_px: 10.0
output_directory: "analysis_results"
preview_count: 8
